name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Copy native library for the .NET binding
        run: cmake --build --preset release --target dotnet_native_copy
      - name: .NET binding tests
        run: dotnet test bindings/dotnet/FastZonal.slnx
      - name: C# harness tests
        run: dotnet test benchmarks/csharp/FzBench.slnx
      - name: Python script tests
        run: |
          python3 -m pip install --quiet numpy rasterio pyogrio shapely pyproj pytest matplotlib
          python3 -m pytest benchmarks/tests -q
      - name: Python binding tests
        run: FASTZONAL_LIBRARY=$PWD/build/release/libfastzonal.so python3 -m pytest bindings/python/tests -q
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build/release/Testing

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release-msvc
      - name: Build
        run: cmake --build --preset release-msvc
      - name: Test
        run: ctest --preset release-msvc
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Copy native library for the .NET binding
        run: cmake --build --preset release-msvc --target dotnet_native_copy
      - name: .NET binding tests
        run: dotnet test bindings/dotnet/FastZonal.slnx
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: build/release-msvc/Testing
